<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generación de Energía · ERC</title>
<style>
  :root{--ink:#0C2A2E;--muted:#5D7276;--line:#D8E4E3;--bg:#EAF1F0;--card:#FFFFFF;
    --gen:#0E8C88;--gen-soft:#D6ECEA;--proy:#B7C6C6;--warn:#C1762E;--ring-track:#E3ECEB;--hl:#FFF6E9}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);
    color:var(--ink);font-feature-settings:"tnum" 1,"lnum" 1;line-height:1.4;padding:0 0 40px}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px}
  header{padding:22px 16px 10px;max-width:520px;margin:0 auto}
  .brand{margin-bottom:12px}
  .brand img{height:34px;width:auto;display:block}
  .eyebrow{font-size:12px;color:var(--muted)}
  h1{font-size:21px;font-weight:650;letter-spacing:-.01em;margin-top:2px}
  .asof{font-size:12.5px;color:var(--muted);margin-top:4px}
  .yearsel{display:flex;gap:6px;align-items:center;padding:12px 16px 0;max-width:520px;margin:0 auto}
  .yearsel .lab{font-size:12px;color:var(--muted);margin-right:2px}
  .seg{display:inline-flex;background:#E0EAE9;border-radius:10px;padding:3px}
  .seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13.5px;
    font-weight:600;padding:6px 14px;border-radius:8px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 6px;max-width:520px;margin:0 auto;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:999px;padding:8px 15px;font-size:14px;font-weight:550;cursor:pointer;transition:.15s;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;
    margin-top:12px;display:flex;align-items:center;gap:18px}
  .hero .num{flex:1}
  .hero .lbl{font-size:12.5px;color:var(--muted)}
  .hero .big{font-size:36px;font-weight:680;letter-spacing:-.02em;line-height:1;margin-top:3px}
  .hero .unit{font-size:15px;font-weight:500;color:var(--muted);margin-left:4px}
  .hero .sub{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.35}
  .ring{flex:0 0 92px;width:92px;height:92px;position:relative}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .pct b{font-size:20px;font-weight:680;letter-spacing:-.02em}
  .ring .pct span{font-size:10px;color:var(--muted);margin-top:1px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
  .stat .lbl{font-size:12px;color:var(--muted)}
  .stat .val{font-size:19px;font-weight:640;letter-spacing:-.01em;margin-top:3px}
  .stat .val small{font-size:12px;font-weight:500;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px 14px;margin-top:10px}
  .card h2{font-size:15px;font-weight:620}
  .legend{display:flex;gap:16px;margin-top:4px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .chart{width:100%;margin-top:12px;overflow:visible}
  .part{margin-top:12px;display:flex;flex-direction:column;gap:9px}
  .prow{display:grid;grid-template-columns:64px 1fr 92px;align-items:center;gap:10px;font-size:13px}
  .ptrack{height:9px;background:var(--gen-soft);border-radius:5px;overflow:hidden}
  .pfill{height:100%;background:var(--gen);border-radius:5px}
  .pval{text-align:right;color:var(--muted);font-size:12.5px}
  .ctrl{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .ctrl label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px}
  .ctrl .fld{flex:1;min-width:130px}
  select,input[type=date]{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;-webkit-appearance:none;appearance:none}
  .daysum{margin-top:12px;font-size:13px;color:var(--muted)}
  .daysum b{color:var(--ink);font-weight:640}
  .pick{margin-top:10px;background:var(--hl);border:1px solid #F0DFC2;border-radius:12px;padding:11px 13px;font-size:13.5px;display:none}
  .pick b{font-weight:660}
  .tbl{margin-top:12px;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:12px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{position:sticky;top:0;background:#F3F8F7;color:var(--muted);font-weight:600;font-size:12px;
    text-align:right;padding:9px 12px;border-bottom:1px solid var(--line)}
  thead th:first-child{text-align:left}
  tbody td{text-align:right;padding:8px 12px;border-bottom:1px solid #EEF4F3;font-variant-numeric:tabular-nums}
  tbody td:first-child{text-align:left;color:var(--muted)}
  tbody tr.nd td{color:#AEBEBE}
  tbody tr.on{background:var(--hl)}
  tbody tr.on td:first-child{color:var(--ink);font-weight:640}
  .gpos{color:var(--gen);font-weight:600}
  .hide{display:none}
</style>
</head>

const MESN=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fmt=n=>Math.round(n).toLocaleString("es-GT");
let sel="TODAS", year=YEARS[YEARS.length-1], selMi=0, selDay=null;

const hasMeta=y=>DATA[PLANTS[0]][y][0].dias.some(d=>'p' in d);

function dayRows(sel,y,mi){
  if(sel!=="TODAS") return DATA[sel][y][mi].dias;
  const base=DATA[PLANTS[0]][y][mi].dias;
  return base.map((_,j)=>{
    let g=0,p=0,c=0,any=false,anyp=false,anyc=false;
    PLANTS.forEach(pl=>{const dd=DATA[pl][y][mi].dias[j];if(!dd)return;
      if(dd.g!=null){g+=dd.g;any=true;} if('p'in dd){p+=dd.p;anyp=true;} if(dd.c!=null){c+=dd.c;anyc=true;}});
    const o={d:base[j].d,g:any?g:null}; if(anyp)o.p=p; if(anyc)o.c=c; return o;
  });
}
function monthAgg(sel,y){
  return MESES.map((mes,mi)=>{
    let g=0,p=0,c=0,any=false,anyp=false,anyc=false;
    dayRows(sel,y,mi).forEach(x=>{if(x.g!=null){g+=x.g;any=true;}if('p'in x){p+=x.p;anyp=true;}if(x.c!=null){c+=x.c;anyc=true;}});
    return {mes,gen:any?g:0,proy:anyp?p:0,comp:anyc?c:0,hasG:any};
  });
}
function lastWithData(sel,y){const r=monthAgg(sel,y);let i=r.map(x=>x.gen>0).lastIndexOf(true);return i<0?0:i;}

function render(){
  const meta=hasMeta(year), r=monthAgg(sel,year);
  const genY=r.reduce((s,x)=>s+x.gen,0);
  const closed=r.filter(x=>x.gen>0);
  const daysReg=dayRowsCountWithData();
  asof_el.textContent=(year===YEARS[YEARS.length-1]?"Datos al día · ":"Año cerrado · ")+"valores en MWh";

  genYTD_el.textContent=fmt(genY);
  if(meta){
    ring_el.style.display="flex";
    heroLbl_el.textContent="Generado a la fecha";
    const proyPer=closed.reduce((s,x)=>s+x.proy,0), proyAnual=r.reduce((s,x)=>s+x.proy,0);
    const compYTD=closed.reduce((s,x)=>s+x.comp,0);
    const pctMeta=proyPer?genY/proyPer:0, pctAnual=proyAnual?genY/proyAnual:0;
    heroSub_el.textContent="Meta del periodo: "+fmt(proyPer)+" MWh · "+closed.length+" meses con registro";
    const C=251.3; ringPct_el.textContent=Math.round(pctMeta*100)+"%";
    ringFill_el.setAttribute("stroke-dashoffset",C*(1-Math.min(pctMeta,1)));
    ringFill_el.setAttribute("stroke",pctMeta>=0.98?"var(--gen)":"var(--warn)");
    s1lbl_el.textContent="Proyección anual"; s1val_el.textContent=fmt(proyAnual);
    s2lbl_el.textContent="Avance del año";   s2val_el.textContent=Math.round(pctAnual*100)+"%";
    if(compYTD>0){compStat.classList.remove("hide");compCover.classList.remove("hide");
      compYTD_el.textContent=fmt(compYTD);compPct_el.textContent=Math.round(genY/compYTD*100)+"%";}
    else{compStat.classList.add("hide");compCover.classList.add("hide");}
  }else{
    ring_el.style.display="none";
    heroLbl_el.textContent="Generación del año";
    heroSub_el.textContent=daysReg+" días con registro";
    s1lbl_el.textContent="Días con registro"; s1val_el.textContent=fmt(daysReg);
    s2lbl_el.textContent="Promedio diario";   s2val_el.innerHTML=fmt(daysReg?genY/daysReg:0)+' <small>MWh</small>';
    compStat.classList.add("hide");compCover.classList.add("hide");
  }

  bars(r,meta); cum(r,meta);

  if(sel==="TODAS"){partCard.classList.remove("hide");
    const sh=PLANTS.map(p=>({p,g:monthAgg(p,year).reduce((s,x)=>s+x.gen,0)})).sort((a,b)=>b.g-a.g);
    const tot=sh.reduce((s,x)=>s+x.g,0)||1;
    part_el.innerHTML=sh.map(s=>{const pc=s.g/tot*100;
      return `<div class="prow"><span>${s.p}</span><span class="ptrack"><span class="pfill" style="width:${pc.toFixed(1)}%"></span></span><span class="pval">${pc.toFixed(0)}% · ${fmt(s.g)}</span></div>`;}).join("");
  }else partCard.classList.add("hide");

  renderDaily(meta);
}
function dayRowsCountWithData(){let n=0;for(let m=0;m<12;m++)dayRows(sel,year,m).forEach(x=>{if(x.g!=null&&x.g>0)n++;});return n;}

function bars(r,meta){
  const W=340,H=200,pL=6,pR=6,pT=8,pB=26,ph=H-pT-pB,pw=W-pL-pR;
  const max=Math.max(...r.map(x=>Math.max(x.gen,meta?x.proy:0)),1),gw=pw/12,bw=gw*(meta?.30:.5),gap=gw*.10;
  let s=`<line x1="${pL}" y1="${pT+ph}" x2="${W-pR}" y2="${pT+ph}" stroke="var(--line)"/>`;
  r.forEach((x,i)=>{const cx=pL+i*gw+gw/2,hg=(x.gen/max)*ph,hp=(x.proy/max)*ph;
    if(meta){const x1=cx-bw-gap/2,x2=cx+gap/2;
      s+=`<rect x="${x2}" y="${pT+ph-hp}" width="${bw}" height="${hp}" rx="2" fill="var(--proy)"/>`;
      if(hg>0)s+=`<rect x="${x1}" y="${pT+ph-hg}" width="${bw}" height="${hg}" rx="2" fill="var(--gen)"/>`;
    }else{ if(hg>0)s+=`<rect x="${cx-bw/2}" y="${pT+ph-hg}" width="${bw}" height="${hg}" rx="2" fill="var(--gen)"/>`; }
    s+=`<text x="${cx}" y="${H-9}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${x.mes}</text>`;});
  document.getElementById("bars").innerHTML=s;
  barsTitle_el.textContent=meta?"Generado vs. proyectado por mes":"Generado por mes";
  barsLeg_el.innerHTML=meta?'<span><i style="background:var(--gen)"></i>Generado</span><span><i style="background:var(--proy)"></i>Proyectado</span>':'<span><i style="background:var(--gen)"></i>Generado</span>';
}
function cum(r,meta){
  const W=340,H=200,pL=6,pR=6,pT=10,pB=26,ph=H-pT-pB,pw=W-pL-pR;
  let ga=0,pa=0;const genA=[],proyA=[];let last=-1;
  r.forEach(x=>{pa+=x.proy;proyA.push(pa);});
  r.forEach((x,i)=>{if(x.gen>0){ga+=x.gen;genA.push(ga);last=i;}else genA.push(null);});
  const max=Math.max(meta?pa:0,ga,1),X=i=>pL+(i/11)*pw,Y=v=>pT+ph-(v/max)*ph;
  let s=`<line x1="${pL}" y1="${pT+ph}" x2="${W-pR}" y2="${pT+ph}" stroke="var(--line)"/>`;
  if(meta)s+=`<polyline points="${proyA.map((v,i)=>X(i)+','+Y(v)).join(' ')}" fill="none" stroke="var(--proy)" stroke-width="2.5"/>`;
  let gp=[];for(let i=0;i<=last;i++)gp.push(X(i)+','+Y(genA[i]));
  if(gp.length){s+=`<polyline points="${gp.join(' ')}" fill="none" stroke="var(--gen)" stroke-width="3"/>`;
    s+=`<circle cx="${X(last)}" cy="${Y(genA[last])}" r="3.5" fill="var(--gen)"/>`;}
  r.forEach((x,i)=>{if(i%2===0)s+=`<text x="${X(i)}" y="${H-9}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${x.mes}</text>`;});
  document.getElementById("cum").innerHTML=s;
  cumTitle_el.textContent=meta?"Acumulado: generado vs. meta":"Generado acumulado";
  cumLeg_el.innerHTML=meta?'<span><i style="background:var(--gen)"></i>Generado acum.</span><span><i style="background:var(--proy)"></i>Meta acum.</span>':'<span><i style="background:var(--gen)"></i>Generado acum.</span>';
}
function renderDaily(meta){
  dayHead_el.innerHTML=meta?"<tr><th>Fecha</th><th>Generado</th><th>Proyectado</th><th>%</th></tr>":"<tr><th>Fecha</th><th>Generado</th></tr>";
  const dr=dayRows(sel,year,selMi);
  let tg=0,tp=0,any=false;dr.forEach(x=>{if(x.g!=null){tg+=x.g;any=true;}if('p'in x)tp+=x.p;});
  daySum_el.innerHTML=any?(`${MESES[selMi]} ${year}: <b>${fmt(tg)}</b> generado`+(meta?` · meta <b>${fmt(tp)}</b> · <b>${Math.round(tg/tp*100)}%</b>`:" MWh")):`${MESES[selMi]} ${year}: sin registro`;
  let body="";
  dr.forEach(x=>{const nd=x.g==null,on=selDay&&selDay.mi===selMi&&selDay.d===x.d;
    const pct=(!nd&&x.p)?Math.round(x.g/x.p*100)+"%":"—";
    body+=`<tr class="${nd?'nd':''} ${on?'on':''}" data-d="${x.d}"><td>${x.d} ${MESN[selMi]}</td><td class="${nd?'':'gpos'}">${nd?'—':fmt(x.g)}</td>`+(meta?`<td>${fmt(x.p||0)}</td><td>${pct}</td>`:"")+"</tr>";});
  dayBody_el.innerHTML=body;
  if(selDay&&selDay.mi===selMi){const row=dr.find(x=>x.d===selDay.d);
    if(row){pick_el.style.display="block";
      pick_el.innerHTML=row.g==null?`<b>${selDay.d} de ${MESES[selMi]} ${year}:</b> sin registro`:`<b>${selDay.d} de ${MESES[selMi]} ${year}:</b> ${fmt(row.g)} MWh generado`+(meta&&row.p?` · meta ${fmt(row.p)} · ${Math.round(row.g/row.p*100)}%`:"");
      const tr=dayBody_el.querySelector(`tr[data-d="${selDay.d}"]`);if(tr)tr.scrollIntoView({block:"center",behavior:"smooth"});}
  }else pick_el.style.display="none";
}

const yearSeg=document.getElementById("yearSeg");
YEARS.forEach(y=>{const b=document.createElement("button");b.textContent=y;b.setAttribute("aria-pressed",y===year);
  b.onclick=()=>{year=y;[...yearSeg.children].forEach(c=>c.setAttribute("aria-pressed",c===b));
    selMi=lastWithData(sel,year);selDay=null;syncBounds();monthSel.value=selMi;render();};
  yearSeg.appendChild(b);});
const chipsEl=document.getElementById("chips");
[["TODAS","Todas"],...PLANTS.map(p=>[p,p])].forEach(([id,label])=>{const b=document.createElement("button");
  b.className="chip";b.textContent=label;b.setAttribute("aria-pressed",id===sel);
  b.onclick=()=>{sel=id;[...chipsEl.children].forEach(c=>c.setAttribute("aria-pressed",c===b));render();};
  chipsEl.appendChild(b);});
const monthSel=document.getElementById("monthSel");
MESES.forEach((m,i)=>{const o=document.createElement("option");o.value=i;o.textContent=m;monthSel.appendChild(o);});
monthSel.onchange=()=>{selMi=+monthSel.value;selDay=null;render();};
const daySel=document.getElementById("daySel");
function syncBounds(){daySel.min=year+"-01-01";daySel.max=year+"-12-31";daySel.value="";}
daySel.onchange=e=>{const v=e.target.value;if(!v)return;const parts=v.split("-").map(Number);
  year=String(parts[0]);[...yearSeg.children].forEach(c=>c.setAttribute("aria-pressed",c.textContent===year));
  selMi=parts[1]-1;selDay={mi:selMi,d:parts[2]};daySel.min=year+"-01-01";daySel.max=year+"-12-31";monthSel.value=selMi;render();};

const asof_el=document.getElementById("asof"),genYTD_el=document.getElementById("genYTD"),
  heroLbl_el=document.getElementById("heroLbl"),heroSub_el=document.getElementById("heroSub"),
  ring_el=document.getElementById("ring"),ringPct_el=document.getElementById("ringPct"),ringFill_el=document.getElementById("ringFill"),
  s1lbl_el=document.getElementById("s1lbl"),s1val_el=document.getElementById("s1val"),
  s2lbl_el=document.getElementById("s2lbl"),s2val_el=document.getElementById("s2val"),
  compStat=document.getElementById("compStat"),compCover=document.getElementById("compCover"),
  compYTD_el=document.getElementById("compYTD"),compPct_el=document.getElementById("compPct"),
  barsTitle_el=document.getElementById("barsTitle"),barsLeg_el=document.getElementById("barsLeg"),
  cumTitle_el=document.getElementById("cumTitle"),cumLeg_el=document.getElementById("cumLeg"),
  partCard=document.getElementById("partCard"),part_el=document.getElementById("part"),
  daySum_el=document.getElementById("daySum"),dayHead_el=document.getElementById("dayHead"),
  dayBody_el=document.getElementById("dayBody"),pick_el=document.getElementById("pick");

selMi=lastWithData("TODAS",year);monthSel.value=selMi;syncBounds();render();

fetch("datos.json").then(r=>r.ok?r.json():null).then(d=>{if(d){DATA=d;selMi=lastWithData(sel,year);monthSel.value=selMi;render();}}).catch(()=>{});
</script>
</body>
</html>
